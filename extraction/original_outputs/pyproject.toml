[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "saner-paper-extraction"
version = "0.2.2"
description = "Token-level features of the original models on the released outputs"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.6.0",
  "bitsandbytes==0.45.5",
  "datasets==3.6.0",
  "huggingface-hub==0.30.2",
  "numpy==1.26.4",
  "pyarrow==18.1.0",
  "PyYAML==6.0.2",
  "safetensors==0.5.3",
  "sentencepiece==0.2.0",
  "tokenizers==0.21.1",
  "transformers==4.49.0",
]

[project.scripts]
saner-reproduction = "saner_reproduction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saner_reproduction = ["runtime_lock.json", "smoke_lock.json"]
